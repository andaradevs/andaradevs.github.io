  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-color: #f8fafc;
      --muted-color: #94a3b8;
      --accent-color: #0284c7;
      --accent-hover: #0369a1;
      --border-color: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      line-height: 1.6;
      padding: 20px;
    }

    .container {
      max-width: 850px;
      margin: 0 auto;
      background-color: var(--card-bg);
      border-radius: 12px;
      padding: 32px;
      border: 1px solid var(--border-color);
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 20px;
      margin-bottom: 24px;
    }

    .title-group h1 {
      font-size: 1.8rem;
      color: var(--text-color);
    }

    .title-group p {
      color: var(--muted-color);
      font-size: 0.9rem;
    }

    .lang-switcher button {
      background: transparent;
      border: 1px solid var(--border-color);
      color: var(--text-color);
      padding: 6px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.2s;
    }

    .lang-switcher button.active, .lang-switcher button:hover {
      background-color: var(--accent-color);
      border-color: var(--accent-color);
    }

    .tabs {
      display: flex;
      gap: 12px;
      margin-bottom: 24px;
    }

    .tab-btn {
      flex: 1;
      padding: 12px;
      background-color: transparent;
      border: 1px solid var(--border-color);
      color: var(--muted-color);
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .tab-btn.active {
      background-color: var(--accent-color);
      color: #ffffff;
      border-color: var(--accent-color);
    }

    .content-section {
      display: none;
    }

    .content-section.active {
      display: block;
    }

    .section-block {
      margin-bottom: 20px;
    }

    .section-block h3 {
      font-size: 1.1rem;
      margin-bottom: 8px;
      color: var(--text-color);
    }

    .section-block p {
      color: var(--muted-color);
      font-size: 0.95rem;
      text-align: justify;
    }

    .external-links {
      margin-top: 8px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .external-links a {
      color: var(--accent-color);
      text-decoration: underline;
      font-size: 0.9rem;
    }

    .external-links a:hover {
      color: var(--accent-hover);
    }

    .footer {
      margin-top: 32px;
      padding-top: 16px;
      border-top: 1px solid var(--border-color);
      text-align: center;
      font-size: 0.85rem;
      color: var(--muted-color);
    }
  </style>
</head>

    <div class="footer">
      <p>© 2026 Andara Devs. <span id="rights-text">All rights reserved.</span></p>
    </div>
  </div>
