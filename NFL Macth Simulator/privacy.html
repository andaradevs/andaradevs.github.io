
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NFL Match Simulator - Legal & Privacy</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-color: #f8fafc;
      --muted-color: #94a3b8;
      --accent-color: #0284c7;
      --accent-hover: #0369a1;
      --border-color: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      line-height: 1.6;
      padding: 20px;
    }

    .container {
      max-width: 850px;
      margin: 0 auto;
      background-color: var(--card-bg);
      border-radius: 12px;
      padding: 32px;
      border: 1px solid var(--border-color);
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 20px;
      margin-bottom: 24px;
    }

    .title-group h1 {
      font-size: 1.8rem;
      color: var(--text-color);
    }

    .title-group p {
      color: var(--muted-color);
      font-size: 0.9rem;
    }

    .lang-switcher button {
      background: transparent;
      border: 1px solid var(--border-color);
      color: var(--text-color);
      padding: 6px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.2s;
    }

    .lang-switcher button.active, .lang-switcher button:hover {
      background-color: var(--accent-color);
      border-color: var(--accent-color);
    }

    .tabs {
      display: flex;
      gap: 12px;
      margin-bottom: 24px;
    }

    .tab-btn {
      flex: 1;
      padding: 12px;
      background-color: transparent;
      border: 1px solid var(--border-color);
      color: var(--muted-color);
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .tab-btn.active {
      background-color: var(--accent-color);
      color: #ffffff;
      border-color: var(--accent-color);
    }

    .content-section {
      display: none;
    }

    .content-section.active {
      display: block;
    }

    .section-block {
      margin-bottom: 20px;
    }

    .section-block h3 {
      font-size: 1.1rem;
      margin-bottom: 8px;
      color: var(--text-color);
    }

    .section-block p {
      color: var(--muted-color);
      font-size: 0.95rem;
      text-align: justify;
    }

    .external-links {
      margin-top: 8px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .external-links a {
      color: var(--accent-color);
      text-decoration: underline;
      font-size: 0.9rem;
    }

    .external-links a:hover {
      color: var(--accent-hover);
    }

    .footer {
      margin-top: 32px;
      padding-top: 16px;
      border-top: 1px solid var(--border-color);
      text-align: center;
      font-size: 0.85rem;
      color: var(--muted-color);
    }
  </style>
</head>
<body>

  <div class="container">

        <p id="last-updated">Last Updated: November 11, 2026</p>
      </div>

      <div class="lang-switcher">

        <button id="btn-en" class="active" onclick="setLanguage('en')">EN</button>
      </div>
    </div>

    <div class="tabs">
      <button id="tab-privacy" class="tab-btn active" onclick="switchTab('privacy')">Privacy Policy</button>

    function renderSectionList(sections) {
      return sections.map(sec => `
        <div class="section-block">
          <h3>${sec.title}</h3>
          <p>${sec.content}</p>
          ${sec.links ? `
            <div class="external-links">
              ${sec.links.map(link => `<a href="${link.url}" target="_blank" rel="noopener noreferrer">${link.text}</a>`).join('')}
            </div>
          ` : ''}
        </div>
      `).join('');
    }

    function renderContent() {
      const langData = data[currentLang];
      
      document.getElementById('last-updated').innerText = langData.lastUpdated;
      document.getElementById('rights-text').innerText = langData.rights;
      document.getElementById('tab-privacy').innerText = langData.tabs.privacy;
      document.getElementById('tab-terms').innerText = langData.tabs.terms;

      document.getElementById('privacy-content').innerHTML = renderSectionList(langData.privacy);
      document.getElementById('terms-content').innerHTML = renderSectionList(langData.terms);
    }

    function setLanguage(lang) {
      currentLang = lang;
      document.getElementById('btn-es').classList.toggle('active', lang === 'es');
      document.getElementById('btn-en').classList.toggle('active', lang === 'en');
      renderContent();
    }

    function switchTab(tab) {
      currentTab = tab;
      document.getElementById('tab-privacy').classList.toggle('active', tab === 'privacy');
      document.getElementById('tab-terms').classList.toggle('active', tab === 'terms');
      
      document.getElementById('privacy-content').classList.toggle('active', tab === 'privacy');
      document.getElementById('terms-content').classList.toggle('active', tab === 'terms');
    }

    renderContent();
  </script>
</body>
</html>
