      padding: 0;

      color: var(--text-color);

      margin: 0 auto;

      padding: 32px;
      border: 1px solid var(--border-color);

      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 20px;
      margin-bottom: 24px;
    }

    .title-group h1 {
      font-size: 1.8rem;
      color: var(--text-color);
    }

    .title-group p {
      color: var(--muted-color);
      font-size: 0.9rem;
    }

    .lang-switcher button {
      background: transparent;
      border: 1px solid var(--border-color);
      color: var(--text-color);
      padding: 6px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.2s;
    }

    .lang-switcher button.active, .lang-switcher button:hover {
      background-color: var(--accent-color);
      border-color: var(--accent-color);
    }

    .tabs {
      display: flex;
      gap: 12px;
      margin-bottom: 24px;
    }

    .tab-btn {
      flex: 1;
      padding: 12px;
      background-color: transparent;
      border: 1px solid var(--border-color);
      color: var(--muted-color);
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .tab-btn.active {
      background-color: var(--accent-color);
      color: #ffffff;
      border-color: var(--accent-color);
    }

    .content-section {
      display: none;
    }

    .content-section.active {
      display: block;
    }

    .section-block {
      margin-bottom: 20px;
    }

    .section-block h3 {
      font-size: 1.1rem;
      margin-bottom: 8px;
      color: var(--text-color);
    }

    .section-block p {
      color: var(--muted-color);
      font-size: 0.95rem;
      text-align: justify;
    }

    .external-links {
      margin-top: 8px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .external-links a {
      color: var(--accent-color);
      text-decoration: underline;
      font-size: 0.9rem;
    }

    .external-links a:hover {
      color: var(--accent-hover);

    .footer {

      padding-top: 16px;
      border-top: 1px solid var(--border-color);
      text-align: center;

    function renderSectionList(sections) {

          <p>${sec.content}</p>
          ${sec.links ? `
            <div class="external-links">
              ${sec.links.map(link => `<a href="${link.url}" target="_blank" rel="noopener noreferrer">${link.text}</a>`).join('')}
            </div>
          ` : ''}
        </div>
      `).join('');
    }

      document.getElementById('privacy-content').innerHTML = renderSectionList(langData.privacy);

      // Render Terms
      document.getElementById('terms-content').innerHTML = renderSectionList(langData.terms);
    }

    function setLanguage(lang) {
      currentLang = lang;
      document.getElementById('btn-es').classList.toggle('active', lang === 'es');
      document.getElementById('btn-en').classList.toggle('active', lang === 'en');
      renderContent();
    }

    function switchTab(tab) {
      currentTab = tab;
      document.getElementById('tab-privacy').classList.toggle('active', tab === 'privacy');
      document.getElementById('tab-terms').classList.toggle('active', tab === 'terms');
      
      document.getElementById('privacy-content').classList.toggle('active', tab === 'privacy');
      document.getElementById('terms-content').classList.toggle('active', tab === 'terms');
    }

    // Ejecutar renderizado inicial en inglés al cargar la página
    renderContent();
  </script>
</body>
</html>
