<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caribbean Metrics - Descargar en Google Play</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #0a0f18;
            color: #ffffff;
            font-family: 'Poppins', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        .card {
            background-color: #131c2a;
            border: 1px solid rgba(0, 242, 254, 0.3);
            border-radius: 20px;
            padding: 2.5rem 2rem;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 10px 30px rgba(0, 242, 254, 0.15);
        }
        .app-icon {
            width: 110px;
            height: 110px;
            border-radius: 22px;
            border: 2px solid #00f2fe;
            margin-bottom: 1.5rem;
            object-fit: cover;
        }
        h1 {
            font-size: 1.6rem;
            margin-bottom: 0.5rem;
        }
        p {
            color: #a0aec0;
            font-size: 0.9rem;
            margin-bottom: 2rem;
        }
        .btn-download {
            display: block;
            background: linear-gradient(135deg, #00f2fe, #4facfe);
            color: #0a0f18;
            font-weight: 700;
            font-size: 1.05rem;
            text-decoration: none;
            padding: 14px 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 242, 254, 0.4);
            transition: transform 0.2s ease;
        }
        .btn-download:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>
    <div class="card">
        <img src="CaribbeanMetrics.png" alt="Caribbean Metrics Logo" class="app-icon">
        <h1>Caribbean Metrics</h1>
        <p>Analítica y proyecciones de béisbol en tiempo real.</p>
        <a href="https://play.google.com/store/apps/details?id=com.app.caribbeanmetrics" class="btn-download">
            DESCARGAR EN GOOGLE PLAY
        </a>
    </div>
</body>
</html>
